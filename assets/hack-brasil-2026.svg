<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Hack Brasil 2026 — Saúde e Bem-Estar</title>
<desc id="desc">Banner de participação no Hack Brasil 2026, com visual escuro, detalhes em verde e ciano e coração com eletrocardiograma.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#051018"/><stop offset=".56" stop-color="#071421"/><stop offset="1" stop-color="#001f21"/></linearGradient>
  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#12f08a"/><stop offset="1" stop-color="#18c9ff"/></linearGradient>
  <linearGradient id="heart" x1="0" x2="1"><stop stop-color="#063d37" stop-opacity=".55"/><stop offset="1" stop-color="#08354d" stop-opacity=".58"/></linearGradient>
  <linearGradient id="bottom" x1="0" x2="1"><stop stop-color="#1462e3" stop-opacity=".7"/><stop offset=".55" stop-color="#00e4cd" stop-opacity=".55"/><stop offset="1" stop-color="#12f08a" stop-opacity=".7"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#70e7ed" stroke-width=".45" opacity=".075"/></pattern>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#07bfe7" opacity=".45"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
